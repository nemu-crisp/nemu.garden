    <ellipse cx="449" cy="845" rx="45" ry="18"/>
    <ellipse cx="522" cy="819" rx="36" ry="14"/>
    <ellipse cx="582" cy="800" rx="28" ry="11"/>
  </g>

  <g opacity="0.9">
    <ellipse cx="446" cy="940" rx="118" ry="35" fill="#050707" opacity="0.42"/>
    <path d="M331 927 C398 891 489 892 565 930 C498 975 405 979 331 927 Z" fill="url(#water)"/>
    <path d="M380 927 C426 912 475 914 520 934" fill="none" stroke="#c4ded7" stroke-width="3" opacity="0.34"/>
    <circle cx="428" cy="918" r="6" fill="#d5f0e3" opacity="0.66" filter="url(#smallGlow)"/>
  </g>

  <circle cx="306" cy="785" r="178" fill="url(#lanternGlow)" filter="url(#softGlow)"/>
  <g>
