    <path d="M274 741 L338 741 L354 875 C319 892 286 891 258 874 Z" fill="#17120f"/>
    <path d="M287 758 L328 758 L336 858 C315 870 294 869 274 857 Z" fill="#c77f37" opacity="0.78"/>
    <path d="M297 776 C322 806 320 834 300 856 C280 831 282 804 297 776 Z" fill="#ffe2a7"/>
    <path d="M286 736 C292 706 319 704 332 736" fill="none" stroke="#75634b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M370 805 C432 774 496 763 566 773" stroke="#9fc7a8" stroke-width="4" opacity="0.42"/>
    <path d="M378 825 C451 837 511 860 556 899" stroke="#86aa98" stroke-width="3" opacity="0.34"/>
    <path d="M393 786 C456 729 521 701 589 701" stroke="#ddb868" stroke-width="3" opacity="0.32"/>
    <path d="M592 701 C612 700 628 701 643 705" stroke="#ddb868" stroke-width="2" opacity="0.12"/>
  </g>

  <g fill="#cbe1cb" opacity="0.68">
    <circle cx="371" cy="805" r="3.2"/>
    <circle cx="438" cy="779" r="2.6"/>
    <circle cx="506" cy="767" r="2.3"/>
    <circle cx="557" cy="775" r="1.9"/>
    <circle cx="378" cy="825" r="2.8"/>
    <circle cx="452" cy="839" r="2.2"/>
    <circle cx="524" cy="874" r="1.8"/>
  </g>

  <g opacity="0.28">
    <path d="M787 892 C853 868 932 846 1030 830" fill="none" stroke="#4c665f" stroke-width="4"/>
    <path d="M803 925 C877 921 961 901 1060 867" fill="none" stroke="#354d4a" stroke-width="3"/>
  </g>

  <rect width="1200" height="1200" fill="#000" opacity="0">
    <animate attributeName="opacity" values="0;0.025;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
