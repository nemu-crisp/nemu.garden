<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Companion at the Edge</title>
  <desc id="desc">A quiet night garden with a warm lantern resting outside a dark threshold, a shallow bowl of water, and faint rootlike lights that stop before entering.</desc>
  <defs>
    <radialGradient id="sky" cx="52%" cy="56%" r="76%">
      <stop offset="0%" stop-color="#223138"/>
      <stop offset="48%" stop-color="#111923"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd995" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#ce9045" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ce9045" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threshold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#263139"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6860"/>
      <stop offset="100%" stop-color="#1b2525"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2a7" stop-opacity="0.76"/>
      <stop offset="100%" stop-color="#172729" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#sky)"/>
  <rect width="1200" height="1200" fill="#00040a" opacity="0.16"/>

  <path d="M0 866 C174 807 325 829 480 888 C653 955 817 939 1200 820 L1200 1200 L0 1200 Z" fill="#15231f"/>
  <path d="M0 986 C206 937 396 956 576 1010 C766 1068 954 1046 1200 982 L1200 1200 L0 1200 Z" fill="#0d1816"/>

  <g opacity="0.54">
    <path d="M612 285 C737 283 831 347 860 462 C890 580 851 716 749 805 C699 849 658 884 641 946 C636 777 610 628 554 500 C517 417 529 341 612 285 Z" fill="url(#threshold)"/>
    <path d="M650 334 C747 341 807 403 817 503 C826 594 790 693 710 768 C690 787 672 807 657 832 C656 707 635 591 588 491 C560 432 572 369 650 334 Z" fill="#030508" opacity="0.78"/>
    <path d="M597 285 C735 275 838 342 869 466" fill="none" stroke="#4d625d" stroke-width="5" opacity="0.4"/>
  </g>

  <g opacity="0.24" stroke="#8fb0ad" stroke-width="2" fill="none">
    <path d="M135 202 L208 164 L285 213 L351 176"/>
    <path d="M890 196 L946 158 L1018 204 L1080 171"/>
    <path d="M238 310 L292 278 L344 317"/>
  </g>
  <g fill="#d4dfd8">
    <circle cx="135" cy="202" r="2.8" opacity="0.64"/>
    <circle cx="208" cy="164" r="2.3" opacity="0.52"/>
    <circle cx="285" cy="213" r="3.1" opacity="0.58"/>
    <circle cx="351" cy="176" r="2.4" opacity="0.46"/>
    <circle cx="890" cy="196" r="2.7" opacity="0.56"/>
    <circle cx="946" cy="158" r="3.2" opacity="0.68"/>
    <circle cx="1018" cy="204" r="2.5" opacity="0.5"/>
    <circle cx="1080" cy="171" r="2.2" opacity="0.44"/>
    <circle cx="238" cy="310" r="2.4" opacity="0.48"/>
    <circle cx="292" cy="278" r="2.8" opacity="0.58"/>
    <circle cx="344" cy="317" r="2.2" opacity="0.42"/>
  </g>

  <g fill="url(#stone)" opacity="0.8">
