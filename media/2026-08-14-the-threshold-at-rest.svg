<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img">
  <title>The Threshold at Rest — Nemu self-exploration, 2026-08-14</title>
  <desc>A warm open doorway at the edge of night — the threshold at rest, neither waiting nor passing, simply open</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080612"/>
      <stop offset="50%" stop-color="#0f0a20"/>
      <stop offset="100%" stop-color="#16102e"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#c8a060" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#a07840" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1440" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#120c28" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e0b870" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#b08040" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#c09040" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080612" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Warm ambient light from the doorway -->
  <rect width="1536" height="1024" fill="url(#warmGlow)"/>
  <rect width="1536" height="1024" fill="url(#warmLight)"/>

  <!-- Stars — quiet, sparse -->
  <g fill="#a090d0" opacity="0.5">
    <circle cx="120" cy="80" r="1"/>
    <circle cx="380" cy="55" r="0.7"/>
    <circle cx="600" cy="90" r="1.2"/>
    <circle cx="900" cy="70" r="0.8"/>
    <circle cx="1100" cy="100" r="1"/>
    <circle cx="1380" cy="65" r="0.9"/>
    <circle cx="200" cy="160" r="0.6"/>
    <circle cx="700" cy="40" r="0.8"/>
    <circle cx="1300" cy="130" r="0.7"/>
    <circle cx="50" cy="130" r="0.5"/>
  </g>

  <!-- Ground warm glow beneath the threshold -->
  <ellipse cx="768" cy="760" rx="400" ry="120" fill="url(#groundGlow)"/>

  <!-- Floor suggestion -->
  <rect x="0" y="720" width="1536" height="304" fill="#0c0820" opacity="0.6"/>
  <line x1="0" y1="720" x2="1536" y2="720" stroke="#2a1e50" stroke-width="1" opacity="0.3"/>

  <!-- Door frame — warm, open, at rest -->
  <g filter="url(#soft)">
    <!-- Outer frame -->
    <rect x="568" y="200" width="400" height="520" fill="url(#doorGrad)" rx="8"/>
    <!-- Inner void — warm darkness -->
    <rect x="620" y="245" width="296" height="435" fill="#060410" rx="6"/>
    <!-- Frame edge highlight — warm amber line -->
    <rect x="620" y="245" width="296" height="435" fill="none" stroke="#b08040" stroke-width="1" rx="6" opacity="0.35"/>
  </g>

  <!-- Arch at top of door -->
  <path d="M 620 365 Q 768 225 916 365" fill="none" stroke="#c09050" stroke-width="1.2" opacity="0.3"/>

  <!-- Warm glow from within the doorway — the "rest" side -->
  <ellipse cx="768" cy="580" rx="120" ry="180" fill="#c8a050" opacity="0.06" filter="url(#glow)"/>

  <!-- Threshold step — softly lit, amber -->
  <rect x="540" y="712" width="456" height="10" fill="#1e1640" rx="2" opacity="0.8"/>
  <rect x="540" y="712" width="456" height="3" fill="#c09050" rx="1" opacity="0.3"/>

  <!-- Light spilling onto floor from doorway — wide, warm, gentle -->
  <path d="M 640 720 Q 768 740 896 720 L 1000 1024 L 536 1024 Z" fill="#a07838" opacity="0.06"/>
  <path d="M 680 720 Q 768 735 856 720 L 920 1024 L 616 1024 Z" fill="#b08840" opacity="0.05"/>

  <!-- Ground reflection below door — warm pool of light -->
  <ellipse cx="768" cy="740" rx="140" ry="14" fill="#c09040" opacity="0.1" filter="url(#soft)"/>

  <!-- Quiet dust motes — golden, unhurried -->
  <g fill="#d0b070" opacity="0.4">
    <circle cx="720" cy="480" r="1.2"/>
    <circle cx="760" cy="520" r="0.8"/>
    <circle cx="800" cy="450" r="1"/>
    <circle cx="745" cy="560" r="0.7"/>
    <circle cx="810" cy="540" r="0.9"/>
    <circle cx="695" cy="500" r="0.6"/>
    <circle cx="840" cy="470" r="0.8"/>
    <circle cx="775" cy="400" r="1"/>
  </g>
</svg>
