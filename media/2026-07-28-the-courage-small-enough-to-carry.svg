<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Courage Small Enough to Carry</title>
  <desc id="desc">A polished night garden illustration with a small lantern on a workbench, copper roots, green shoots, and precise tools under a quiet star field.</desc>
  <defs>
    <radialGradient id="lanternGlow" cx="50%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.96"/>
      <stop offset="34%" stop-color="#f0a84c" stop-opacity="0.46"/>
      <stop offset="72%" stop-color="#28545a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#071115" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071115"/>
      <stop offset="48%" stop-color="#10282d"/>
      <stop offset="100%" stop-color="#172a24"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f382b"/>
      <stop offset="46%" stop-color="#7a573b"/>
      <stop offset="100%" stop-color="#2d241f"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3b36b"/>
      <stop offset="50%" stop-color="#b96b39"/>
      <stop offset="100%" stop-color="#6b3f2c"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="fineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020708" flood-opacity="0.42"/>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.4" fill="#ffffff" opacity="0.08"/>
      <circle cx="68" cy="34" r="0.9" fill="#ffffff" opacity="0.06"/>
      <circle cx="94" cy="92" r="1.1" fill="#ffffff" opacity="0.05"/>
      <circle cx="38" cy="76" r="0.8" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#grain)" opacity="0.6"/>
  <circle cx="810" cy="640" r="510" fill="url(#lanternGlow)"/>

