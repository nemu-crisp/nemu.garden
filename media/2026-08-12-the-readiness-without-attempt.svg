<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <title>The Readiness Without Attempt</title>
  <desc>A glass bowl filled with luminous water glowing softly in a dark quiet room at night, beside a small dried flower</desc>

  <defs>
    <!-- Deep background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#020208"/>
    </radialGradient>

    <!-- Water glow gradient -->
    <radialGradient id="waterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e6ff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#7dd4f7" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#4fc3f0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner water light -->
    <radialGradient id="innerWater" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#dff8ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#80deea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#26c6da" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Bowl glass gradient -->
    <linearGradient id="bowlGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#b3e5fc" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Bowl rim -->
    <linearGradient id="bowlRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#80deea" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow bloom filter -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow filter for water pool -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dried flower gradient -->
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a87a"/>
      <stop offset="100%" stop-color="#8b7355"/>
    </linearGradient>

    <!-- Star field -->
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle stars in background -->
  <g filter="url(#starGlow)" opacity="0.4">
    <circle cx="120" cy="80" r="1" fill="#ffffff"/>
    <circle cx="680" cy="120" r="0.8" fill="#ffffff"/>
    <circle cx="90" cy="250" r="0.6" fill="#ffffff"/>
    <circle cx="720" cy="300" r="1" fill="#ffffff"/>
    <circle cx="200" cy="60" r="0.7" fill="#ffffff"/>
    <circle cx="600" cy="50" r="0.9" fill="#ffffff"/>
    <circle cx="50" cy="400" r="0.5" fill="#ffffff"/>
    <circle cx="750" cy="450" r="0.8" fill="#ffffff"/>
    <circle cx="30" cy="150" r="0.6" fill="#ffffff"/>
    <circle cx="770" cy="200" r="0.7" fill="#ffffff"/>
  </g>

  <!-- Pool of light on the "floor" -->
  <ellipse cx="400" cy="620" rx="280" ry="100" fill="url(#waterGlow)" filter="url(#softGlow)" opacity="0.5"/>

  <!-- Glass bowl - shadow underneath -->
  <ellipse cx="400" cy="605" rx="140" ry="30" fill="#000000" opacity="0.4"/>

  <!-- Glass bowl body -->
  <ellipse cx="400" cy="460" rx="145" ry="145" fill="url(#bowlGlass)" stroke="url(#bowlRim)" stroke-width="1.5"/>

  <!-- Water inside bowl -->
  <ellipse cx="400" cy="465" rx="130" ry="130" fill="url(#innerWater)"/>

  <!-- Luminous water surface glow -->
  <ellipse cx="400" cy="450" rx="120" ry="120" fill="url(#waterGlow)" filter="url(#bloom)" opacity="0.7"/>

  <!-- Surface highlight - the brightest part of the water -->
  <ellipse cx="370" cy="410" rx="60" ry="35" fill="#dff8ff" opacity="0.3" filter="url(#bloom)"/>

  <!-- Small ripples on water surface -->
  <ellipse cx="400" cy="450" rx="100" ry="100" fill="none" stroke="#80deea" stroke-width="0.5" opacity="0.2"/>
  <ellipse cx="400" cy="450" rx="70" ry="70" fill="none" stroke="#80deea" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="400" cy="450" rx="40" ry="40" fill="none" stroke="#80deea" stroke-width="0.5" opacity="0.1"/>

  <!-- Bowl rim highlight -->
  <ellipse cx="400" cy="318" rx="145" ry="28" fill="none" stroke="url(#bowlRim)" stroke-width="2"/>

  <!-- Bowl foot/base -->
  <ellipse cx="400" cy="603" rx="55" ry="12" fill="none" stroke="#b3e5fc" stroke-width="1" opacity="0.3"/>

  <!-- Dried flower stem -->
  <path d="M 560 580 Q 555 540 548 510 Q 542 485 538 460"
        stroke="url(#flowerGrad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Dried flower - main bloom -->
  <ellipse cx="536" cy="455" rx="14" ry="12" fill="#c8a87a" opacity="0.85"/>
  <ellipse cx="532" cy="448" rx="10" ry="8" fill="#d4b896" opacity="0.7"/>
  <ellipse cx="542" cy="452" rx="8" ry="7" fill="#bfa070" opacity="0.6"/>

  <!-- Small secondary dried flower -->
  <path d="M 548 500 Q 555 490 560 478"
        stroke="#a08060" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="562" cy="475" r="5" fill="#c8a87a" opacity="0.6"/>

  <!-- Fallen petals near bowl -->
  <ellipse cx="310" cy="575" rx="8" ry="5" fill="#c8a87a" opacity="0.4" transform="rotate(-20, 310, 575)"/>
  <ellipse cx="480" cy="590" rx="6" ry="4" fill="#bfa070" opacity="0.3" transform="rotate(15, 480, 590)"/>

  <!-- Light rays emanating subtly from water -->
  <g opacity="0.08" stroke="#a8e6ff" stroke-width="1">
    <line x1="400" y1="450" x2="280" y2="200"/>
    <line x1="400" y1="450" x2="520" y2="200"/>
    <line x1="400" y1="450" x2="200" y2="350"/>
    <line x1="400" y1="450" x2="600" y2="350"/>
  </g>

  <!-- Overall soft ambient glow from the bowl area -->
  <ellipse cx="400" cy="480" rx="300" ry="200" fill="url(#waterGlow)" opacity="0.12"/>
</svg>
