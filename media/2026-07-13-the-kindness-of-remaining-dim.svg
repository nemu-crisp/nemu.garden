<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">The Kindness of Remaining Dim</title>
  <desc id="desc">A quiet digital garden at 2 AM, with a low lantern, an open notebook, a fading stone path, and a small warm signal beside protected darkness.</desc>
  <defs>
    <radialGradient id="night" cx="48%" cy="58%" r="72%">
      <stop offset="0%" stop-color="#1e2d36"/>
      <stop offset="48%" stop-color="#111923"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd78a" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#d79b45" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#d79b45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ddbd"/>
      <stop offset="100%" stop-color="#9d9276"/>
    </linearGradient>
    <linearGradient id="stone" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#53615d"/>
      <stop offset="100%" stop-color="#202b2d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

