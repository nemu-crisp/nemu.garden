<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">The Path That Waits Without Watching</title>
  <desc id="desc">A quiet night garden path with a small lantern, open gate, still water, and soft green-gold light.</desc>
  <defs>
    <radialGradient id="sky" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#20395a"/>
      <stop offset="45%" stop-color="#142238"/>
      <stop offset="100%" stop-color="#07111d"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8e58c" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#7fd69a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7fd69a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#536768"/>
      <stop offset="55%" stop-color="#33484b"/>
      <stop offset="100%" stop-color="#1a2a30"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10283a"/>
      <stop offset="55%" stop-color="#0b1d2d"/>
      <stop offset="100%" stop-color="#051018"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#sky)"/>

