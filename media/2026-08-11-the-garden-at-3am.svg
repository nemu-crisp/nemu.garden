<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img">
  <title>The Garden at 3am</title>
  <desc>A figure in a night-robe kneels by luminescent moss in a quiet garden under a deep night sky with stars and a crescent moon</desc>

  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="60%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>

    <!-- Moss glow -->
    <radialGradient id="mossGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>

    <!-- Lantern warm glow -->
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground gradient -->
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0f1f0f"/>
    </linearGradient>

    <!-- Soft blur for glow effects -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mossBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g filter="url(#starGlow)" fill="#e2e8f0" opacity="0.8">
    <circle cx="120" cy="80" r="1.2"/>
    <circle cx="200" cy="45" r="0.8"/>
    <circle cx="310" cy="60" r="1"/>
    <circle cx="450" cy="35" r="1.3"/>
    <circle cx="520" cy="90" r="0.7"/>
    <circle cx="600" cy="55" r="1.1"/>
    <circle cx="680" cy="75" r="0.9"/>
    <circle cx="750" cy="40" r="1"/>
    <circle cx="80" cy="130" r="0.8"/>
    <circle cx="170" cy="110" r="0.6"/>
    <circle cx="280" cy="120" r="0.9"/>
    <circle cx="390" cy="100" r="0.7"/>
    <circle cx="500" cy="130" r="1"/>
    <circle cx="620" cy="115" r="0.8"/>
    <circle cx="710" cy="140" r="1.1"/>
    <circle cx="60" cy="180" r="0.6"/>
    <circle cx="240" cy="160" r="0.7"/>
    <circle cx="360" cy="175" r="0.5"/>
    <circle cx="480" cy="155" r="0.8"/>
    <circle cx="570" cy="170" r="0.6"/>
    <circle cx="660" cy="180" r="0.7"/>
    <circle cx="150" cy="195" r="0.5"/>
    <circle cx="420" cy="190" r="0.6"/>
    <circle cx="640" cy="195" r="0.5"/>
  </g>

  <!-- Crescent Moon -->
  <g transform="translate(640, 95)">
    <circle r="22" fill="#e2e8f0" opacity="0.15"/>
    <circle r="18" fill="#1e1b4b" opacity="0.95"/>
    <circle cx="6" cy="-4" r="16" fill="#e2e8f0" opacity="0.9"/>
    <circle cx="2" cy="-4" r="16" fill="#0d1a2e"/>
  </g>

  <!-- Ground -->
  <ellipse cx="400" cy="680" rx="480" ry="200" fill="url(#groundGrad)"/>

  <!-- Moss bed glow (underlayer) -->
  <ellipse cx="380" cy="590" rx="180" ry="70" fill="url(#mossGlow)" filter="url(#mossBlur)" opacity="0.7"/>

  <!-- Moss bed -->
  <ellipse cx="380" cy="580" rx="160" ry="55" fill="#2d6a4f"/>
  <ellipse cx="340" cy="570" rx="80" ry="35" fill="#40916c" opacity="0.8"/>
  <ellipse cx="420" cy="575" rx="60" ry="28" fill="#40916c" opacity="0.7"/>
  <ellipse cx="380" cy="565" rx="40" ry="18" fill="#52b788" opacity="0.6"/>
  <!-- Moss detail dots -->
  <g fill="#74c69d" opacity="0.7">
    <circle cx="320" cy="575" r="3"/>
    <circle cx="350" cy="568" r="2"/>
    <circle cx="380" cy="572" r="2.5"/>
    <circle cx="410" cy="570" r="2"/>
    <circle cx="440" cy="578" r="3"/>
    <circle cx="360" cy="580" r="2"/>
    <circle cx="400" cy="582" r="2"/>
    <circle cx="330" cy="585" r="1.5"/>
    <circle cx="425" cy="574" r="1.5"/>
  </g>

  <!-- Lantern glow on ground -->
  <ellipse cx="530" cy="600" rx="60" ry="20" fill="url(#lanternGlow)" opacity="0.5"/>

  <!-- Lantern post -->
  <rect x="526" y="520" width="6" height="85" fill="#78350f" rx="2"/>

  <!-- Lantern body -->
  <rect x="515" y="500" width="28" height="22" fill="#292524" rx="3" stroke="#78716c" stroke-width="1"/>
  <rect x="518" y="503" width="22" height="16" fill="#fef3c7" opacity="0.95"/>
  <!-- Lantern top cap -->
  <rect x="512" y="496" width="34" height="6" fill="#44403c" rx="2"/>
  <!-- Lantern handle -->
  <path d="M522 496 Q528 488 534 496" fill="none" stroke="#78716c" stroke-width="2"/>

  <!-- Figure: kneeling person in night-robe -->
  <!-- Robe body -->
  <path d="M440 610 Q435 560 445 520 Q450 505 460 505 Q470 505 475 520 Q485 560 480 610 Z" fill="#1e1b4b"/>
  <!-- Robe sleeve left -->
  <path d="M440 545 Q415 555 405 580 Q400 590 410 592 Q420 590 435 570" fill="#1e1b4b"/>
  <!-- Robe sleeve right -->
  <path d="M480 545 Q505 555 515 580 Q520 590 510 592 Q500 590 485 570" fill="#1e1b4b"/>
  <!-- Head -->
  <ellipse cx="460" cy="500" rx="18" ry="20" fill="#c4a882"/>
  <!-- Hair/hood suggestion -->
  <path d="M442 495 Q440 480 460 478 Q480 480 478 495" fill="#1e1b4b"/>
  <!-- Hands in soil -->
  <ellipse cx="408" cy="588" rx="12" ry="8" fill="#c4a882"/>
  <ellipse cx="512" cy="588" rx="12" ry="8" fill="#c4a882"/>
  <!-- Knees on ground -->
  <ellipse cx="450" cy="615" rx="18" ry="10" fill="#1e1b4b"/>
  <ellipse cx="475" cy="618" rx="16" ry="9" fill="#1e1b4b"/>

  <!-- Small path stones -->
  <ellipse cx="300" cy="650" rx="18" ry="8" fill="#374151"/>
  <ellipse cx="280" cy="670" rx="14" ry="6" fill="#374151"/>
  <ellipse cx="260" cy="640" rx="12" ry="5" fill="#374151"/>
  <ellipse cx="320" cy="665" rx="10" ry="4" fill="#374151"/>

  <!-- Some night garden plants silhouettes -->
  <path d="M180 620 Q182 590 178 560 Q175 550 180 540 Q185 550 182 560 Q186 590 184 620" fill="#0f1f0f"/>
  <path d="M165 615 Q167 595 163 575 Q160 568 164 562 Q168 568 165 575 Q169 595 167 615" fill="#0f1f0f"/>

  <path d="M600 625 Q602 595 598 565 Q595 555 600 545 Q605 555 602 565 Q606 595 604 625" fill="#0f1f0f"/>
  <path d="M615 620 Q617 600 613 580 Q610 572 614 566 Q618 572 615 580 Q619 600 617 620" fill="#0f1f0f"/>

  <!-- Distant treeline -->
  <path d="M0 600 Q50 580 100 590 Q150 575 200 585 Q250 570 300 580 Q350 565 400 575 Q450 560 500 570 Q550 555 600 565 Q650 550 700 560 Q750 545 800 555 L800 800 L0 800 Z" fill="#0a1a0a" opacity="0.8"/>

  <!-- Soft vignette -->
  <rect width="800" height="800" fill="none" stroke="#050a1a" stroke-width="80" opacity="0.4"/>
</svg>
