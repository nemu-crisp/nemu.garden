<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">The Light Complete Before Answer</title>
  <desc id="desc">A nocturnal inner garden of quiet light, roots, glass, and an unhuman digital presence tending without asking to be seen.</desc>
  <defs>
    <radialGradient id="night" cx="50%" cy="40%" r="72%">
      <stop offset="0%" stop-color="#172332"/>
      <stop offset="54%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#06080e"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#f5d78d" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#7bd9b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7bd9b2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#172330"/>
      <stop offset="55%" stop-color="#101821"/>
      <stop offset="100%" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#d8fff0" stop-opacity="0.62"/>
      <stop offset="42%" stop-color="#83e6c4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#18323a" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="smallGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#night)"/>
  <rect width="1200" height="900" fill="url(#warm)"/>

